name: Publicar VoltIA

# Compila o código privado (allysongrollimd-svg/biadi) com uma chave de leitura,
# assina com a chave da B.IA.DI e publica o APK no release "biadi" deste
# repositório. Os carros leem esse release para se atualizar sozinhos.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou commit do código"
        default: "main"
      notas:
        description: "O que mudou"
        default: "Atualização da VoltIA"
      versao:
        description: "Nome da versão (ex.: 1.0.0). Vazio = 0.1.<número do build>"
        default: ""
      teste:
        description: "Só teste: gera o APK assinado sem publicar (para instalar num carro por ADB)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          repository: allysongrollimd-svg/biadi
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.BIADI_DEPLOY_KEY }}
          path: src

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Modelo de voz offline (Vosk pt, para chamar pelo nome)
        run: |
          set -e
          curl -sSL -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/model.zip -d /tmp/model
          dst=src/app/src/main/assets/model-pt
          mkdir -p "$dst"
          cp -r /tmp/model/vosk-model-small-pt-0.3/* "$dst/"
          echo "pt-0.3-${{ github.run_number }}" > "$dst/uuid"
          du -sh "$dst"

      - name: Chave de assinatura
        env:
          B64: ${{ secrets.BIADI_KEYSTORE_B64 }}
        run: |
          echo "$B64" | base64 -d > "$RUNNER_TEMP/biadi.p12"
          echo "BIADI_KEYSTORE_FILE=$RUNNER_TEMP/biadi.p12" >> "$GITHUB_ENV"

      - name: Compilar e testar
        working-directory: src
        env:
          BIADI_KEYSTORE_PASSWORD: ${{ secrets.BIADI_KEYSTORE_PASSWORD }}
          BIADI_KEY_ALIAS: ${{ secrets.BIADI_KEY_ALIAS }}
          BIADI_KEY_PASSWORD: ${{ secrets.BIADI_KEY_PASSWORD }}
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          NAME="${{ inputs.versao }}"
          [ -n "$NAME" ] || NAME="0.1.${{ github.run_number }}"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace \
            -PbiadiVersionCode=$CODE -PbiadiVersionName=$NAME

      - name: APK de teste (não publica)
        if: ${{ inputs.teste }}
        run: cp src/app/build/outputs/apk/release/*.apk "BIADI-teste-v${NAME}-c${CODE}.apk"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.teste }}
        with:
          name: biadi-teste
          path: BIADI-teste-*.apk
          retention-days: 3

      - name: Publicar no release "biadi"
        if: ${{ !inputs.teste }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls src/app/build/outputs/apk/release/*.apk | head -n1)
          OUT="BIADI-v${NAME}-c${CODE}.apk"
          cp "$APK" "$OUT"
          ls -l "$OUT"
          NOTES="${{ inputs.notas }} (versão $NAME, código $CODE, commit ${{ inputs.ref }})"
          if gh release view biadi -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for a in $(gh release view biadi -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              gh release delete-asset biadi "$a" -R "$GITHUB_REPOSITORY" -y
            done
            gh release edit biadi -R "$GITHUB_REPOSITORY" --title "VoltIA" --notes "$NOTES"
          else
            gh release create biadi -R "$GITHUB_REPOSITORY" --title "VoltIA" --notes "$NOTES"
          fi
          gh release upload biadi "$OUT" -R "$GITHUB_REPOSITORY" --clobber
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/biadi/$OUT"
